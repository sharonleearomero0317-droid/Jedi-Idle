<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jedi Idle — v1.0.0</title>
<style>
:root{--ink:#20372a;--muted:#718271;--paper:#fffdf4;--green:#4b9658;--line:#dce5d3;--gold:#f2c96d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--ink);background:#eef3e7}button{font:inherit;cursor:pointer;border:0;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.app{height:100dvh;min-height:560px;display:grid;grid-template-rows:76px 1fr 66px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);z-index:3}.logo{font-size:21px;font-weight:950;letter-spacing:-.7px}.logo small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.6px}.stats{display:flex;gap:8px;margin-left:auto}.stat{padding:7px 12px;background:#f0f5e8;border:1px solid var(--line);border-radius:13px;min-width:90px}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.stat b{font-size:17px}.content{position:relative;overflow:hidden}.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:#d8edc8}.viewport.drag{cursor:grabbing}.world{position:absolute;width:1400px;height:1000px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:36px;background-color:#cce7b8;background-image:radial-gradient(#72ac6735 1.5px,transparent 1.5px);background-size:32px 32px}.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.path path{fill:none;stroke:#f2e5bb;stroke-width:90;stroke-linecap:round}.lake{position:absolute;left:1010px;top:125px;width:245px;height:150px;border-radius:48% 52% 60% 40%;background:#9bd8e0;border:8px solid #8ac6c9;transform:rotate(-15deg)}.label{position:absolute;color:#61865d;font-size:12px;font-weight:900;letter-spacing:2px}.tree{position:absolute;font-size:34px;pointer-events:none;filter:drop-shadow(0 3px 2px #42653b22)}.building{position:absolute;width:220px;border:3px solid white;background:var(--paper);border-radius:20px;box-shadow:0 10px 0 #456e3422,0 16px 30px #315a3322;text-align:center;padding:0 0 14px;cursor:pointer;color:var(--ink)}.building .roof{height:100px;display:grid;place-items:center;font-size:54px;border-radius:15px 15px 5px 5px;background:#f1c96d}.building.green .roof{background:#a9dba0}.name{font-weight:950;margin-top:11px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#fffdf4eF;border:1px solid #fff;border-radius:14px;padding:10px 16px;font-size:12px;font-weight:750;white-space:nowrap;box-shadow:0 5px 18px #42653b22}.bottom{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:var(--paper);border-top:1px solid var(--line);z-index:3}.nav{background:#edf3e7;color:#49624d;padding:10px 18px;border-radius:13px;font-weight:850}.nav.active{background:var(--green);color:white}.overlay{position:absolute;inset:0;z-index:5;background:#1b322b66;display:grid;place-items:center;padding:18px}.panel{background:var(--paper);width:min(720px,100%);max-height:100%;overflow:auto;border-radius:22px;padding:22px;box-shadow:0 25px 80px #18302055;border:1px solid white}.panelhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.panelhead h2{margin:0;font-size:24px;letter-spacing:-.7px}.panelhead p{margin:4px 0;color:var(--muted);font-size:13px}.close{margin-left:auto;background:#eaf0e4;border-radius:10px;padding:8px 12px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.card{border:1px solid var(--line);background:#fffef9;border-radius:16px;padding:14px}.cropicon{font-size:30px}.card h3{margin:5px 0 3px;font-size:15px}.muted{color:var(--muted);font-size:12px}.action{background:var(--green);color:white;border-radius:10px;padding:9px 12px;font-weight:850;margin-top:10px}.action.gold{background:#e7b947;color:#3f3215}.action.light{background:#eaf0e4;color:#34513a}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row+ .row{margin-top:8px}.plotgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.plot{min-height:132px;border-radius:15px;background:#e5d4ae;border:2px solid #cbb486;padding:10px 5px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.plot .plant{font-size:31px;line-height:1.4}.plot b{font-size:12px}.plot small{font-size:10px;color:#6b654d;margin-top:3px}.plot button{margin-top:7px;padding:6px 8px;border-radius:8px;font-size:11px;font-weight:850;background:#4b9658;color:white}.plot .ready{background:#e7b947;color:#3f3215}.plot.empty{background:#dfc99a}.notice{padding:11px 13px;background:#f0f5e8;border-radius:12px;font-size:12px;color:#536c52;margin-bottom:13px}.emptymsg{text-align:center;padding:35px 10px;color:var(--muted)}.version{font-size:10px;font-weight:900;color:#68816a;background:#edf3e7;border-radius:8px;padding:5px 8px;margin-left:5px}
@media(max-width:600px){.app{grid-template-rows:70px 1fr 62px}.top{padding:8px 10px;gap:7px}.logo{font-size:17px}.stats{gap:4px}.stat{min-width:0;padding:6px 8px}.stat b{font-size:14px}.stat small{font-size:8px}.nav{padding:10px 12px;font-size:12px}.bottom{gap:5px}.plotgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.plot{min-height:115px}.panel{padding:16px}.hint{font-size:10px;max-width:92%;white-space:normal;text-align:center}.building{width:190px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">🌱 Jedi Idle <small>YOUR LITTLE FARM <span class="version">v1.0.0</span></small></div><div class="stats"><div class="stat"><small>Cash</small><b id="cash">$50</b></div><div class="stat"><small>Seeds</small><b id="seedCount">0</b></div><div class="stat"><small>Harvests</small><b id="harvestCount">0</b></div></div></header>
<main class="content"><div class="viewport" id="viewport"><div class="world" id="world">
<svg class="path" viewBox="0 0 1400 1000" preserveAspectRatio="none"><path d="M-50 580 C250 580 290 390 520 470 S800 710 1000 560 S1230 400 1460 470"/></svg>
<div class="lake"></div><div class="label" style="left:110px;top:105px">SUNNY MEADOW</div><div class="label" style="left:920px;top:330px">POND VIEW</div>
<button class="building" style="left:290px;top:250px" onclick="openPanel('shop')"><div class="roof">🏪</div><div class="name">Seed Market</div><div class="sub">Buy seeds for your farm · tap to enter</div></button>
<button class="building green" style="left:690px;top:505px" onclick="openPanel('greenhouse')"><div class="roof">🏡</div><div class="name">Greenhouse</div><div class="sub">10 growing plots · tap to enter</div></button>
<div class="tree" style="left:130px;top:300px">🌳</div><div class="tree" style="left:180px;top:720px">🌲</div><div class="tree" style="left:480px;top:160px">🌳</div><div class="tree" style="left:610px;top:820px">🌳</div><div class="tree" style="left:920px;top:690px">🌲</div><div class="tree" style="left:1170px;top:400px">🌳</div><div class="tree" style="left:1260px;top:760px">🌲</div><div class="tree" style="left:800px;top:160px">🌳</div>
</div><div class="hint">🖱️ Drag to explore · Tap a building to go inside</div></div><div id="overlayRoot"></div></main>
<nav class="bottom"><button class="nav active" data-tab="farm" onclick="showTab('farm')">🗺️ Farm</button><button class="nav" data-tab="inventory" onclick="showTab('inventory')">🎒 Inventory</button><button class="nav" data-tab="credits" onclick="showTab('credits')">⭐ Credits</button></nav>
</div>
<script>
const CROPS=[
{id:'carrot',name:'Carrot',icon:'🥕',price:5,grow:10,value:12,desc:'A quick and easy first crop.'},
{id:'wheat',name:'Wheat',icon:'🌾',price:8,grow:18,value:19,desc:'A reliable golden harvest.'},
{id:'tomato',name:'Tomato',icon:'🍅',price:12,grow:30,value:30,desc:'Juicy, bright, and worth the wait.'},
{id:'strawberry',name:'Strawberry',icon:'🍓',price:18,grow:45,value:44,desc:'A sweet berry for patient farmers.'},
{id:'pumpkin',name:'Pumpkin',icon:'🎃',price:25,grow:60,value:65,desc:'The biggest crop in the starter market.'}
];
const fresh=()=>({cash:50,seeds:{carrot:2,wheat:0,tomato:0,strawberry:0,pumpkin:0},plots:Array.from({length:10},()=>null),harvested:{carrot:0,wheat:0,tomato:0,strawberry:0,pumpkin:0},totalHarvests:0});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem('jediIdleSave')||'{}')};state.seeds={...fresh().seeds,...state.seeds};state.harvested={...fresh().harvested,...state.harvested};state.plots=Array.from({length:10},(_,i)=>state.plots?.[i]||null)}catch(e){state=fresh()}
let activePanel=null,returnTab='farm';
function save(){localStorage.setItem('jediIdleSave',JSON.stringify(state));updateStats()}
function updateStats(){document.getElementById('cash').textContent='$'+Math.floor(state.cash);document.getElementById('seedCount').textContent=Object.values(state.seeds).reduce((a,b)=>a+b,0);document.getElementById('harvestCount').textContent=state.totalHarvests}
function fmt(s){if(s<=0)return 'Ready!';return s>=60?Math.floor(s/60)+'m '+s%60+'s':s+'s'}
function openPanel(which){activePanel=which;renderPanel()}
function closePanel(){activePanel=null;document.getElementById('overlayRoot').innerHTML=''}
function showTab(tab){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='farm'){closePanel();return}openPanel(tab)}
function panelShell(title,subtitle,body){return '<div class="overlay" onclick="if(event.target===this)closePanel()"><section class="panel"><div class="panelhead"><div><h2>'+title+'</h2><p>'+subtitle+'</p></div><button class="close" onclick="closePanel()">✕</button></div>'+body+'</section></div>'}
function renderPanel(){
let html='';
if(activePanel==='shop'){html='<div class="notice">🌱 Pick a seed, pay once, then plant it in an empty greenhouse plot. Each crop has its own grow timer.</div><div class="cards">'+CROPS.map(c=>'<article class="card"><div class="row"><span class="cropicon">'+c.icon+'</span><b>$'+c.price+'</b></div><h3>'+c.name+' Seeds</h3><div class="muted">'+c.desc+'</div><div class="row" style="margin-top:8px"><span class="muted">⏱️ '+c.grow+' seconds</span><span class="muted">Owned: '+state.seeds[c.id]+'</span></div><button class="action" '+(state.cash<c.price?'disabled':'')+' onclick="buySeed(\''+c.id+'\')">Buy seed · $'+c.price+'</button></article>').join('')+'</div>';html=panelShell('🏪 Seed Market','Five seeds to start your farming journey',html)}
else if(activePanel==='greenhouse'){html='<div class="notice">🏡 Plant a seed in an empty plot. Plants grow in real time while the game is open. When the timer reaches zero, harvest your crop into Inventory.</div><div class="plotgrid">'+state.plots.map((p,i)=>plotHtml(p,i)).join('')+'</div>';html=panelShell('🏡 Greenhouse','10 plots · grow, harvest, and repeat',html)}
else if(activePanel==='inventory'){let rows=CROPS.filter(c=>state.harvested[c.id]>0);html='<div class="notice">🎒 Harvested crops are stored here. Sell crops for cash, then buy more seeds and keep your farm growing.</div>';html+=rows.length?'<div class="cards">'+rows.map(c=>'<article class="card"><div class="row"><span class="cropicon">'+c.icon+'</span><span class="muted">+$'+c.value+' each</span></div><h3>'+c.name+'</h3><div class="muted">In inventory: <b>'+state.harvested[c.id]+'</b></div><button class="action" onclick="sellCrop(\''+c.id+'\')">Sell 1 · +$'+c.value+'</button><button class="action gold" style="margin-left:5px" onclick="sellAll(\''+c.id+'\')">Sell all · +$'+(c.value*state.harvested[c.id])+'</button></article>').join('')+'</div>':'<div class="emptymsg"><div style="font-size:40px">🧺</div><b>Your basket is empty</b><p>Harvest a ready plant in the greenhouse to see it here.</p></div>';html+='<div class="row" style="margin-top:16px"><span class="muted">Sell every harvested crop at once</span><button class="action" onclick="sellEverything()">Sell all crops</button></div>';html=panelShell('🎒 Crop Inventory','Your harvests, ready to sell',html)}
else if(activePanel==='credits'){html='<div class="card" style="text-align:center;padding:28px"><div style="font-size:54px">🌱</div><h2 style="margin:8px 0">Jedi Idle</h2><p>A tiny farming idle game — Version 1.0.0</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p><b>Created by</b><br>Jedi Romero</p><p><b>Playtester</b><br>John</p><p class="muted">Thanks for playing and helping this little farm grow!</p></div>';html=panelShell('⭐ Credits','The people behind the farm',html)}
document.getElementById('overlayRoot').innerHTML=html;updateStats()
}
function plotHtml(p,i){if(!p)return '<div class="plot empty"><div class="plant">🟫</div><b>Plot '+(i+1)+'</b><small>Empty soil</small><button onclick="openPlant('+i+')">Plant seed</button></div>';let c=CROPS.find(x=>x.id===p.crop);let left=Math.max(0,Math.ceil((p.readyAt-Date.now())/1000));if(left===0)return '<div class="plot"><div class="plant">'+c.icon+'</div><b>'+c.name+'</b><small>Fully grown!</small><button class="ready" onclick="harvest('+i+')">Harvest</button></div>';let progress=Math.max(0,Math.min(100,100-left/c.grow*100));return '<div class="plot"><div class="plant">'+(progress<35?'🌱':progress<75?'🌿':c.icon)+'</div><b>'+c.name+'</b><small>Growing · '+fmt(left)+'</small><div style="width:80%;height:5px;background:#cbb486;border-radius:5px;margin-top:6px"><div style="height:100%;width:'+progress+'%;background:#4b9658;border-radius:5px"></div></div><button class="light" onclick="cancelPlant('+i+')">Growing…</button></div>'}
function openPlant(i){let available=CROPS.filter(c=>state.seeds[c.id]>0);if(!available.length){alert('You have no seeds! Visit the Seed Market to buy some.');return}let opts=available.map(c=>c.icon+' '+c.name+' ('+state.seeds[c.id]+' owned)').join('\n');let choice=prompt('Which seed would you like to plant? Enter a number:\n'+available.map((c,j)=>(j+1)+'. '+c.name+' — '+c.grow+'s to grow').join('\n'));let n=Number(choice)-1;if(choice===null||!Number.isInteger(n)||n<0||n>=available.length)return;let c=available[n];state.seeds[c.id]--;state.plots[i]={crop:c.id,readyAt:Date.now()+c.grow*1000};save();renderPanel()}
function buySeed(id){let c=CROPS.find(x=>x.id===id);if(state.cash<c.price)return;state.cash-=c.price;state.seeds[id]++;save();renderPanel()}
function harvest(i){let p=state.plots[i];if(!p||p.readyAt>Date.now())return;state.harvested[p.crop]=(state.harvested[p.crop]||0)+1;state.totalHarvests++;state.plots[i]=null;save();renderPanel()}
function cancelPlant(i){let p=state.plots[i];if(!p)return;alert('This crop is still growing. Check back when its timer finishes!')}
function sellCrop(id){if(state.harvested[id]<1)return;let c=CROPS.find(x=>x.id===id);state.harvested[id]--;state.cash+=c.value;save();renderPanel()}
function sellAll(id){let c=CROPS.find(x=>x.id===id),n=state.harvested[id];state.cash+=n*c.value;state.harvested[id]=0;save();renderPanel()}
function sellEverything(){CROPS.forEach(c=>{state.cash+=state.harvested[c.id]*c.value;state.harvested[c.id]=0});save();renderPanel()}
function tick(){if(activePanel==='greenhouse')renderPanel();else updateStats()}
const viewport=document.getElementById('viewport'),world=document.getElementById('world');let drag=false,startX=0,startY=0,baseX=0,baseY=0,panX=0,panY=0;
function applyPan(){world.style.left='calc(50% + '+panX+'px)';world.style.top='calc(50% + '+panY+'px)'}
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;startX=e.clientX;startY=e.clientY;baseX=panX;baseY=panY;viewport.classList.add('drag');viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!drag)return;panX=Math.max(-420,Math.min(420,baseX+e.clientX-startX));panY=Math.max(-300,Math.min(300,baseY+e.clientY-startY));applyPan()});
viewport.addEventListener('pointerup',()=>{drag=false;viewport.classList.remove('drag')});viewport.addEventListener('pointercancel',()=>{drag=false;viewport.classList.remove('drag')});
updateStats();setInterval(tick,1000);
</script>
</body></html>
