<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jedi Idle — v1.0.0</title>
<style>
:root{--bg:#f4f3e5;--paper:#fffdf5;--green:#4d965a;--dark:#203b2b;--muted:#718271;--line:#dce5d3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;color:var(--dark);background:var(--bg)}button{font:inherit;cursor:pointer;border:0;transition:.15s}button:hover{filter:brightness(1.04);transform:translateY(-1px)}.app{height:100dvh;display:grid;grid-template-rows:72px 1fr 64px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);z-index:3}.logo{font-size:20px;font-weight:900}.logo small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px}.stats{display:flex;gap:8px;margin-left:auto}.stat{padding:8px 12px;background:#f0f5e8;border:1px solid var(--line);border-radius:13px;min-width:95px}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.stat b{font-size:17px}.content{position:relative;overflow:hidden}.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:#d8edc8}.viewport.drag{cursor:grabbing}.world{position:absolute;width:1500px;height:1100px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:40px;background-color:#cce7b8;background-image:radial-gradient(#72ac6735 1.5px,transparent 1.5px);background-size:32px 32px}.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.path path{fill:none;stroke:#f2e5bb;stroke-width:85;stroke-linecap:round}.lake{position:absolute;left:1050px;top:120px;width:300px;height:185px;border-radius:48% 52% 60% 40%;background:#9bd8e0;border:9px solid #8ac6c9;transform:rotate(-15deg)}.label{position:absolute;color:#61865d;font-size:12px;font-weight:900;letter-spacing:2px}.tree{position:absolute;font-size:34px;pointer-events:none}.building{position:absolute;width:210px;border:3px solid white;background:#fffdf5;border-radius:20px;box-shadow:0 10px 0 #456e3422,0 16px 30px #315a3322;text-align:center;padding:0 0 14px}.roof{height:88px;display:grid;place-items:center;font-size:51px;border-radius:15px 15px 5px 5px;background:#f1c96d}.green .roof{background:#a9dba0}.name{font-weight:900;margin-top:11px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.tag{position:absolute;top:-12px;right:-8px;background:#fff0b9;border:2px solid white;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:900}.market{left:380px;top:300px}.green{left:790px;top:570px}.hint{position:absolute;top:14px;left:14px;background:#ffffffdf;padding:10px 13px;border-radius:13px;font-size:12px;font-weight:750;color:#53735a;pointer-events:none}.zoom{position:absolute;right:15px;bottom:15px;display:grid;gap:7px}.zoom button{width:42px;height:42px;border-radius:13px;background:var(--paper);border:1px solid var(--line);font-size:22px}.nav{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--paper);border-top:1px solid var(--line);padding:7px;z-index:3}.nav button{border-radius:13px;padding:10px 16px;background:transparent;color:var(--muted);font-size:13px;font-weight:850}.nav button.active{background:#e5f2dc;color:#2f7544}.overlay{display:none;position:absolute;inset:0;background:#17362977;backdrop-filter:blur(4px);z-index:5;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{width:min(730px,100%);max-height:85%;overflow:auto;background:var(--paper);border-radius:23px;box-shadow:0 25px 70px #142b1d55}.head{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--line);z-index:2}.head .ico{font-size:27px;background:#e6f2dc;padding:10px;border-radius:14px}.head h2{margin:0;font-size:21px}.head p{margin:3px 0 0;font-size:12px;color:var(--muted)}.close{margin-left:auto;border-radius:11px;background:#edf1e8;width:38px;height:38px;font-size:21px}.body{padding:19px}.note{padding:12px 14px;border-radius:13px;background:#f0f5e8;color:#55755a;font-size:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.seed{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);background:white;border-radius:15px;min-width:0}.seed .emoji{font-size:28px;background:#f0f5e6;padding:10px;border-radius:12px}.seedinfo{flex:1;min-width:0}.seedinfo b{font-size:13px}.seedinfo small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.seedinfo em{display:block;color:#986d16;font-size:11px;font-weight:850;margin-top:6px;font-style:normal}.buy,.primary{background:var(--green);color:white;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:900}.secondary{background:#edf4e7;color:#3f7148;border-radius:10px;padding:9px 11px;font-weight:850}.section{font-size:11px;letter-spacing:1.2px;color:#78907b;font-weight:900;margin:16px 0 10px;text-transform:uppercase}.plots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.plot{min-height:165px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}.plant{font-size:35px}.plot b{font-size:12px;margin-top:7px}.plot small{font-size:11px;color:var(--muted);margin-top:4px}.plot button{margin-top:10px;width:100%}.bar{height:7px;background:#e8eee2;border-radius:8px;overflow:hidden;width:100%;margin-top:9px}.bar span{display:block;height:100%;background:#7bbd69}.row{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);background:white;border-radius:14px;margin-bottom:8px}.row .emoji{font-size:24px}.row .details{flex:1}.row b{font-size:13px}.row small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.qty{font-weight:900;background:#f0f5e8;padding:7px;border-radius:9px}.sellall{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff4d3;border:1px solid #f1df9e;padding:13px;border-radius:14px}.sellall small{display:block;color:#8c7538;font-size:11px;margin-top:4px}.empty{text-align:center;padding:24px;color:var(--muted)}.log{border-left:3px solid #9bcf83;padding:2px 0 17px 15px;margin-left:7px;position:relative}.log:before{content:"";position:absolute;left:-7px;top:2px;width:9px;height:9px;border-radius:50%;background:#7eb96b;border:2px solid var(--paper)}.log small{font-size:10px;color:#7c927e;font-weight:900}.log h3{font-size:14px;margin:4px 0}.log p{font-size:12px;color:#62796a;line-height:1.55;margin:0}.credit{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);background:white;border-radius:16px;margin-bottom:10px}.avatar{font-size:26px;background:#e6f2dc;padding:13px;border-radius:15px}.credit p{margin:4px 0 0;font-size:12px;color:var(--muted)}.toast{position:absolute;bottom:78px;left:50%;transform:translate(-50%,12px);background:#244a32;color:white;padding:11px 15px;border-radius:12px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.top{padding:8px 10px}.logo{font-size:16px}.stats{gap:4px}.stat{min-width:0;padding:7px}.stat:last-child{display:none}.stat b{font-size:14px}.nav{gap:0}.nav button{padding:10px 9px;font-size:11px}.grid{grid-template-columns:1fr}.plots{grid-template-columns:repeat(2,minmax(0,1fr))}.building{width:185px}.world{transform:translate(-50%,-50%) scale(.85)}}@media(max-width:390px){.logo small{display:none}.nav button{padding:9px 7px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">🌱 Jedi Idle <small>VERSION 1.0.0</small></div><div class="stats"><div class="stat"><small>💵 Cash</small><b id="cash">$100</b></div><div class="stat"><small>🎒 Inventory</small><b id="items">0 items</b></div><div class="stat"><small>🌿 Growing</small><b id="growing">0 / 6</b></div></div></header>
<main class="content"><div class="viewport" id="viewport"><div class="world" id="world">
<svg class="path" viewBox="0 0 1500 1100" preserveAspectRatio="none"><path d="M130 850 C280 700 370 710 490 560 S700 430 820 600 S1040 750 1200 570 S1330 420 1430 480"/></svg>
<div class="lake"></div><div class="label" style="left:180px;top:180px">MEADOW GROVE</div><div class="label" style="left:1100px;top:340px">WHISPERING LAKE</div><div class="label" style="left:1000px;top:880px">OPEN FIELDS</div>
<span class="tree" style="left:210px;top:310px">🌳</span><span class="tree" style="left:300px;top:350px">🌲</span><span class="tree" style="left:600px;top:200px">🌳</span><span class="tree" style="left:700px;top:250px">🌲</span><span class="tree" style="left:970px;top:330px">🌳</span><span class="tree" style="left:1320px;top:390px">🌲</span><span class="tree" style="left:1400px;top:740px">🌳</span><span class="tree" style="left:600px;top:830px">🌲</span><span class="tree" style="left:410px;top:900px">🌳</span><span class="tree" style="left:1190px;top:1000px">🌲</span><span class="tree" style="left:200px;top:630px">🌲</span>
<button class="building market" id="market"><div class="roof">🏪</div><div class="name">Seed Market</div><div class="sub">Pick your next crop</div><span class="tag">SHOP</span></button>
<button class="building green" id="green"><div class="roof">🌿</div><div class="name">Greenhouse</div><div class="sub">Plant · Grow · Harvest</div><span class="tag">6 PLOTS</span></button>
</div></div><div class="hint">🖱️ Drag to explore · Tap a building to enter</div><div class="zoom"><button id="zin">+</button><button id="zout">−</button><button id="reset">⌖</button></div>
<div class="overlay" id="overlay"><section class="modal"><div class="head"><div class="ico" id="modalIcon">🌱</div><div><h2 id="title">Seed Market</h2><p id="subtitle">Everything starts with a seed.</p></div><button class="close" id="close">×</button></div><div class="body" id="body"></div></section></div><div class="toast" id="toast"></div></main>
<nav class="nav"><button class="active" data-tab="map">🗺️ Map</button><button data-tab="inventory">🎒 Inventory</button><button data-tab="updates">📝 Update Log</button><button data-tab="credits">✨ Credits</button></nav>
</div>
<script>
const CROPS=[
{id:'carrot',name:'Carrot',emoji:'🥕',cost:10,sell:18,sec:12,desc:'A dependable little classic.'},
{id:'tomato',name:'Tomato',emoji:'🍅',cost:18,sell:31,sec:20,desc:'Juicy, bright, and worth the wait.'},
{id:'corn',name:'Corn',emoji:'🌽',cost:28,sell:48,sec:30,desc:'A sunny crop with a sweet payoff.'},
{id:'strawberry',name:'Strawberry',emoji:'🍓',cost:40,sell:70,sec:42,desc:'A little berry with a big value.'},
{id:'pumpkin',name:'Pumpkin',emoji:'🎃',cost:55,sell:98,sec:55,desc:'The biggest crop in the first season.'}];
let cash=100,seeds={},harvests={},plots=Array(6).fill(null),selected='carrot',modal='',zoom=1,px=0,py=0,drag=null,toastTimer;
const $=id=>document.getElementById(id), crop=id=>CROPS.find(c=>c.id===id), total=o=>Object.values(o).reduce((a,b)=>a+b,0);
function stats(){$('cash').textContent='$'+cash.toLocaleString();let n=total(harvests);$('items').textContent=n+' item'+(n===1?'':'s');$('growing').textContent=plots.filter(p=>p&&p.ready>Date.now()).length+' / 6'}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2100)}
function open(name){modal=name;$('overlay').classList.add('show');let c={market:['🏪','Seed Market','Buy seeds and choose what to grow.'],green:['🌿','Greenhouse','Six little plots. What will you grow?'],inventory:['🎒','Your Inventory','Seeds to plant and harvests ready to sell.'],updates:['📝','Update Log','A tiny look at what is growing.'],credits:['✨','Credits','The people behind this little world.']}[name];$('modalIcon').textContent=c[0];$('title').textContent=c[1];$('subtitle').textContent=c[2];render()}
function close(){modal='';$('overlay').classList.remove('show');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='map'))}
function render(){let b=$('body');if(modal==='market')b.innerHTML=marketHTML();if(modal==='green')b.innerHTML=greenHTML();if(modal==='inventory')b.innerHTML=inventoryHTML();if(modal==='updates')b.innerHTML=updatesHTML();if(modal==='credits')b.innerHTML=creditsHTML()}
function marketHTML(){return '<div class="note">💡 Start with Carrots, then reinvest your Cash in crops that sell for more.</div><div class="section">Available seeds · Season 1</div><div class="grid">'+CROPS.map(c=>'<div class="seed"><div class="emoji">'+c.emoji+'</div><div class="seedinfo"><b>'+c.name+' Seeds</b><small>'+c.desc+'</small><em>💵 $'+c.cost+' each · sells for $'+c.sell+'</em></div><button class="buy" onclick="buy(\\''+c.id+'\\')">Buy 1</button></div>').join('')+'</div><p style="font-size:11px;color:var(--muted)">Seeds are stored in your inventory until you plant them.</p>'}
function greenHTML(){let s='<div class="note">🌱 Pick a seed you own, then plant it in an empty plot. Crops grow in real time while the game is open.</div><div class="section">Choose a seed</div><div style="display:flex;gap:7px;flex-wrap:wrap">'+CROPS.map(c=>'<button class="'+(selected===c.id?'primary':'secondary')+'" onclick="choose(\\''+c.id+'\\')">'+c.emoji+' '+c.name+' ('+(seeds[c.id]||0)+')</button>').join('')+'</div><div class="section">Your plots · '+plots.filter(Boolean).length+'/6 occupied</div><div class="plots">';
plots.forEach((p,i)=>{if(!p){s+='<div class="plot"><div class="plant">🟫</div><b>Empty Plot '+(i+1)+'</b><small>Ready for a seed</small><button class="primary" onclick="plant('+i+')">Plant '+crop(selected).name+'</button></div>'}else{let c=crop(p.id),left=Math.max(0,p.ready-Date.now()),pct=Math.min(100,100-left/(c.sec*1000)*100);s+='<div class="plot"><div class="plant">'+(left===0?c.emoji:'🌱')+'</div><b>'+(left===0?'Ready: '+c.name:c.name+' growing')+'</b><small>'+(left===0?'Your harvest is ready!':Math.ceil(left/1000)+'s remaining')+'</small><div class="bar"><span style="width:'+pct+'%"></span></div><button class="'+(left===0?'primary':'secondary')+'" '+(left===0?'onclick="harvest('+i+')"':'disabled')+'>'+(left===0?'Harvest':'Growing…')+'</button></div>'}});return s+'</div>'}
function inventoryHTML(){let n=total(harvests),value=CROPS.reduce((a,c)=>a+(harvests[c.id]||0)*c.sell,0),s='<div class="sellall"><div><b>Sell all harvests</b><small>'+n+' crop items · worth $'+value+'</small></div><button class="primary" onclick="sellAll()">Sell All</button></div><div class="section">Harvests · '+n+' items</div>';let rows=CROPS.filter(c=>(harvests[c.id]||0)>0);if(!rows.length)s+='<div class="empty">🧺<p><b>No harvests yet</b></p><small>Grow crops in the Greenhouse and harvest them to see them here.</small><p><button class="primary" onclick="close();open(\\'green\\')">Go to Greenhouse</button></p></div>';else rows.forEach(c=>s+='<div class="row"><span class="emoji">'+c.emoji+'</span><div class="details"><b>'+c.name+'</b><small>$'+c.sell+' each · $'+(harvests[c.id]*c.sell)+' total</small></div><span class="qty">× '+harvests[c.id]+'</span><button class="buy" onclick="sell(\\''+c.id+'\\')">Sell 1</button></div>');s+='<div class="section">Seed pouch · '+total(seeds)+' seeds</div>';let sr=CROPS.filter(c=>(seeds[c.id]||0)>0);if(!sr.length)s+='<div class="empty"><b>Your seed pouch is empty.</b><p><button class="secondary" onclick="close();open(\\'market\\')">Visit Seed Market</button></p></div>';else sr.forEach(c=>s+='<div class="row"><span class="emoji">'+c.emoji+'</span><div class="details"><b>'+c.name+' Seeds</b><small>Ready to plant in your Greenhouse</small></div><span class="qty">× '+seeds[c.id]+'</span></div>');return s}
function updatesHTML(){return '<div class="note">🌼 Welcome to the very first version of Jedi Idle!</div><div class="log"><small>VERSION 1.0.0 · LAUNCH</small><h3>The little farm begins</h3><p>Explore a draggable map with two buildings: Seed Market and Greenhouse.</p></div><div class="log"><small>VERSION 1.0.0 · CROPS</small><h3>Five seeds to discover</h3><p>Grow Carrots, Tomatoes, Corn, Strawberries, and Pumpkins, each with unique growing times and selling prices.</p></div><div class="log"><small>VERSION 1.0.0 · INVENTORY</small><h3>Harvest and earn</h3><p>Keep seeds and harvested crops separate. Sell harvests for Cash and reinvest in your farm.</p></div><div class="log"><small>VERSION 1.0.0 · INTERFACE</small><h3>A cozy starting world</h3><p>Added the map, Inventory, Update Log, Credits, and six greenhouse plots.</p></div><p style="font-size:11px;color:var(--muted)">Next up: more crops, upgrades, and new places to explore. 🌱</p>'}
function creditsHTML(){return '<div class="credit"><div class="avatar">🌱</div><div><b>Jedi Romero</b><p>Creator · Game design and original idea</p></div></div><div class="credit"><div class="avatar">🧪</div><div><b>John</b><p>Playtester · Helping make the game better</p></div></div><div class="note">Thanks for playing Jedi Idle v1.0.0. Every great farm starts with one seed.</div>'}
function buy(id){let c=crop(id);if(cash<c.cost){toast('Not enough Cash for '+c.name+' seeds.');return}cash-=c.cost;seeds[id]=(seeds[id]||0)+1;stats();render();toast('Bought 1 '+c.name+' seed!')}
function choose(id){selected=id;render()}
function plant(i){if(plots[i])return;if(!(seeds[selected]>0)){toast('You need '+crop(selected).name+' seeds first!');return}seeds[selected]--;plots[i]={id:selected,ready:Date.now()+crop(selected).sec*1000};stats();render();toast(crop(selected).name+' planted!')}
function harvest(i){let p=plots[i];if(!p||p.ready>Date.now())return;harvests[p.id]=(harvests[p.id]||0)+1;let n=crop(p.id).name;plots[i]=null;stats();render();toast('Harvested '+n+'! Added to inventory.')}
function sell(id){if(!(harvests[id]>0))return;harvests[id]--;cash+=crop(id).sell;stats();render();toast('Sold '+crop(id).name+' for $'+crop(id).sell+'!')}
function sellAll(){let n=total(harvests);if(!n){toast('No harvests to sell yet.');return}let earned=0;CROPS.forEach(c=>{earned+=(harvests[c.id]||0)*c.sell;harvests[c.id]=0});cash+=earned;stats();render();toast('Sold '+n+' crops for $'+earned+'!')}
$('market').onclick=()=>open('market');$('green').onclick=()=>open('green');$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab==='map'){close();return}open(b.dataset.tab)});
let vp=$('viewport'),world=$('world');function apply(){world.style.transform='translate(calc(-50% + '+px+'px),calc(-50% + '+py+'px)) scale('+zoom+')'}vp.addEventListener('pointerdown',e=>{if(e.target.closest('.building')||e.target.closest('.zoom'))return;drag={x:e.clientX,y:e.clientY,px:px,py:py};vp.setPointerCapture(e.pointerId);vp.classList.add('drag')});vp.addEventListener('pointermove',e=>{if(!drag)return;px=drag.px+e.clientX-drag.x;py=drag.py+e.clientY-drag.y;apply()});['pointerup','pointercancel'].forEach(ev=>vp.addEventListener(ev,()=>{drag=null;vp.classList.remove('drag')}));$('zin').onclick=()=>{zoom=Math.min(1.4,zoom+.1);apply()};$('zout').onclick=()=>{zoom=Math.max(.55,zoom-.1);apply()};$('reset').onclick=()=>{zoom=1;px=py=0;apply()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});stats();setInterval(()=>{stats();if(modal==='green')render()},500);
</script>
</body></html>
